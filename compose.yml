services:
  app:
    build: .
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    ports:
      - "127.0.0.1:3000:3000"

  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","no","--save",""]
    expose:
      - "6379"
